/* =====================================================
   STORAGE
===================================================== */

let saved = JSON.parse(
  localStorage.getItem("schkitSaved") || "[]"
);

let statuses = JSON.parse(
  localStorage.getItem("schkitStatuses") || "{}"
);


/* =====================================================
   TOAST
===================================================== */

function showToast(message) {

  const toast = document.getElementById("toast");

  toast.textContent = message;
  toast.style.display = "block";

  clearTimeout(window.toastTimer);

  window.toastTimer = setTimeout(() => {
    toast.style.display = "none";
  }, 2800);
}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value) {

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


/* =====================================================
   RENDER SCHOLARSHIPS
===================================================== */

function renderScholarships(list) {

  const container = document.getElementById("results");

  document.getElementById("resultCount").textContent =
    `${list.length} opportunit${list.length === 1 ? "y" : "ies"} found`;

  if (!list.length) {

    container.innerHTML = `
      <div style="
        grid-column:1/-1;
        background:white;
        border:1px solid var(--border);
        padding:30px;
        border-radius:16px;
        text-align:center;
      ">
        <h3>No matches yet</h3>

        <p style="
          color:var(--muted);
          margin:8px 0 18px;
        ">
          Try changing your destination,
          degree or search term.
        </p>

        <button
          class="primary"
          onclick="clearFilters()"
        >
          Clear filters
        </button>
      </div>
    `;

    return;
  }

  container.innerHTML =
    list.map(s => scholarshipHTML(s)).join("");
}


/* =====================================================
   SCHOLARSHIP CARD
===================================================== */

function scholarshipHTML(s) {

  const isSaved = saved.includes(s.id);

  return `
    <article class="scholarship">

      <div class="sch-top">

        <div>
          <h3>${escapeHTML(s.name)}</h3>

          <div class="organization">
            ${escapeHTML(s.organization)}
            ·
            ${escapeHTML(s.country)}
          </div>
        </div>

        <span class="funding">
          ${escapeHTML(s.funding)}
        </span>

      </div>

      <div class="tags">
        ${s.tags.map(tag => `
          <span class="tag">
            ${escapeHTML(tag)}
          </span>
        `).join("")}
      </div>

      <div class="deadline">
        ⏳ Deadline: ${escapeHTML(s.deadline)}
      </div>

      <div class="card-actions">

        <a
          class="view-btn"
          href="${s.link}"
          target="_blank"
          rel="noopener noreferrer"
        >
          Official site ↗
        </a>

        <button
          class="save-btn"
          onclick="toggleSave(${s.id})"
        >
          ${isSaved ? "★ Saved" : "☆ Save"}
        </button>

      </div>

    </article>
  `;
}


/* =====================================================
   SEARCH
===================================================== */

function findScholarships() {

  const destination =
    document.getElementById("destination").value;

  const degree =
    document.getElementById("degree").value;

  const field =
    document.getElementById("field").value
      .toLowerCase()
      .trim();

  const search =
    document.getElementById("search").value
      .toLowerCase()
      .trim();

  const results = scholarships.filter(s => {

    const destinationMatch =
      !destination ||
      s.country === destination ||
      s.country === "Multiple";

    const degreeMatch =
      !degree ||
      s.degree.includes(degree);

    const fieldMatch =
      !field ||
      s.field.toLowerCase().includes(field) ||
      s.field === "All fields";

    const searchMatch =
      !search ||
      (
        s.name +
        s.organization +
        s.country +
        s.tags.join(" ")
      )
      .toLowerCase()
      .includes(search);

    return (
      destinationMatch &&
      degreeMatch &&
      fieldMatch &&
      searchMatch
    );
  });

  renderScholarships(results);

  document
    .getElementById("results")
    .scrollIntoView({
      behavior: "smooth",
      block: "start"
    });
}


/* =====================================================
   SAVE
===================================================== */

function toggleSave(id) {

  if (saved.includes(id)) {

    saved = saved.filter(
      item => item !== id
    );

    showToast(
      "Removed from saved scholarships."
    );

  } else {

    saved.push(id);

    showToast(
      "Scholarship saved."
    );
  }

  localStorage.setItem(
    "schkitSaved",
    JSON.stringify(saved)
  );

  renderScholarships(scholarships);
  renderTracker();
}


/* =====================================================
   SAVED
===================================================== */

function showSaved() {

  const list =
    scholarships.filter(
      s => saved.includes(s.id)
    );

  renderScholarships(list);

  document
    .getElementById("results")
    .scrollIntoView({
      behavior: "smooth"
    });
}


/* =====================================================
   TRACKER
===================================================== */

function renderTracker() {

  const tracker =
    document.getElementById("trackerList");

  const list =
    scholarships.filter(
      s => saved.includes(s.id)
    );

  if (!list.length) {

    tracker.innerHTML = `
      <div class="tracker-item">

        <div>
          <strong>
            Your tracker is empty.
          </strong>

          <small>
            Save a scholarship and it will appear here.
          </small>
        </div>

      </div>
    `;

    return;
  }

  tracker.innerHTML =
    list.map(s => `

      <div class="tracker-item">

        <div>

          <strong>
            ${escapeHTML(s.name)}
          </strong>

          <small>
            ${escapeHTML(s.organization)}
            ·
            ${escapeHTML(s.deadline)}
          </small>

        </div>

        <select
          onchange="changeStatus(${s.id},this.value)"
        >

          <option
            ${statuses[s.id] === "Interested" ? "selected" : ""}
          >
            Interested
          </option>

          <option
            ${statuses[s.id] === "Preparing" ? "selected" : ""}
          >
            Preparing
          </option>

          <option
            ${statuses[s.id] === "Applied" ? "selected" : ""}
          >
            Applied
          </option>

          <option
            ${statuses[s.id] === "Accepted" ? "selected" : ""}
          >
            Accepted
          </option>

          <option
            ${statuses[s.id] === "Rejected" ? "selected" : ""}
          >
            Rejected
          </option>

        </select>

      </div>

    `).join("");
}


function changeStatus(id, status) {

  statuses[id] = status;

  localStorage.setItem(
    "schkitStatuses",
    JSON.stringify(statuses)
  );

  showToast(
    "Application status updated."
  );
}


/* =====================================================
   CLEAR FILTERS
===================================================== */

function clearFilters() {

  document.getElementById("destination").value = "";

  document.getElementById("field").value = "";
  document.getElementById("search").value = "";
  document.getElementById("citizenship").value = "";
  document.getElementById("intake").value = "";

  document.getElementById(
    "modalBody"

    "modal"

function closeModal() {

  document.getElementById(
    "modal"

}

function openEssay() {

        Give SCHKIT the actual scholarship question
        and your real experiences.
      </p>

      <div class="field" style="margin-top:15px">

        <label>

        </label>

          placeholder="Why should you receive this scholarship?"

      </div>

      <div class="field">

        <label>

        </label>

        <textarea
          id="essayExperience"
          placeholder="Leadership, volunteering, projects, challenges, achievements..."
        ></textarea>

      </div>

        class="primary"
        onclick="buildEssay()"
      >
        Build essay structure
      </button>

      <div id="toolOutput"></div>
    `
  );
}


function buildEssay() {

  const prompt =
    document.getElementById("essayPrompt")
      .value.trim();

  const experience =
    document.getElementById("essayExperience")
      .value.trim();

  if (!prompt || !experience) {

    showToast(
      "Enter the prompt and your real experiences."
    );

    return;
  }

  document.getElementById("toolOutput")
    .innerHTML = `

      <div class="output">

        <strong>
          Suggested essay structure
        </strong>

        <br><br>

        <strong>1. Opening</strong><br>
        Start with one specific moment from your
        experience that connects naturally to the prompt.

        <br><br>

        <strong>2. Challenge or context</strong><br>
        Explain what happened and why it mattered.

        <br><br>

        <strong>3. Your actions</strong><br>
        Focus on what YOU did.

        <br><br>

        <strong>4. Impact</strong><br>
        Explain the result, lesson or change.

        <br><br>

        <strong>5. Future connection</strong><br>
        Connect the experience to your academic goals,
        career plans and why this scholarship matters.

        <br><br>

        <strong>Prompt:</strong><br>
        ${escapeHTML(prompt)}

        <br><br>

        <strong>Your evidence:</strong><br>
        ${escapeHTML(experience)}

      </div>
    `;
}

        ✓ Did you connect the lesson to your future?

function openEligibility() {

        the complete requirements on the official scholarship page.
      </p>

      <div class="field" style="margin-top:15px">

        <label>Scholarship</label>

        <select id="eligibilityScholarship">

          ${scholarships.map(
            s => `
              <option value="${s.id}">
                ${escapeHTML(s.name)}
              </option>
            `
          ).join("")}

        </select>

      </div>

      <div class="field" style="margin-top:12px">

        <label>Your degree</label>

        <select id="eligibilityDegree">
          <option>Bachelor's</option>
          <option>Master's</option>
          <option>PhD</option>
        </select>

      </div>

      <button
        class="primary"
        style="margin-top:15px"
        onclick="checkEligibility()"
      >
        Check profile
      </button>

      <div id="toolOutput"></div>
    `
  );
}


function checkEligibility() {

  const id =
    Number(
      document.getElementById(
        "eligibilityScholarship"
      ).value
    );

  const degree =
    document.getElementById(
      "eligibilityDegree"
    ).value;

  const scholarship =
    scholarships.find(
      s => s.id === id
    );

  const match =
    scholarship.degree.includes(degree);

  document.getElementById("toolOutput")
    .innerHTML = `

      <div class="output">

        <strong>
          ${match
            ? "Potential match"
            : "Degree mismatch"
          }
        </strong>

        <br><br>

        ${
          match
            ? "The listed degree category matches your selection. You still need to verify citizenship, academic, programme-specific and deadline requirements on the official website."
            : "This scholarship's listed degree categories do not include your selected degree. Check the official requirements before applying."
        }

      </div>
    `;
}

===================================================== */

/* =====================================================
   DARK MODE
===================================================== */

function toggleTheme() {

  document.body.classList.toggle("dark");

  const dark =
    document.body.classList.contains("dark");

  localStorage.setItem(
    "schkitDark",
    dark
  );

  document.getElementById(
    "themeButton"
  ).textContent =
    dark ? "☀" : "☾";
}


if (
  localStorage.getItem("schkitDark") === "true"
) {

  document.body.classList.add("dark");

  document.getElementById(
    "themeButton"
  ).textContent = "☀";
}

===================================================== */

renderScholarships(
  scholarships

renderTracker();


/* =====================================================
   MODAL CLOSE
===================================================== */

document
  .getElementById("modal")
  .addEventListener(
    "click",
    function(e) {

      if (e.target === this) {
        closeModal();
      }

    }
  );


/* =====================================================
   SEARCH ENTER KEY
===================================================== */

document
  .getElementById("search")
  .addEventListener(
    "keydown",
    function(e) {

      if (e.key === "Enter") {
        findScholarships();
      }

    }
  );

</script>
